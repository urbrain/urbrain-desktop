# © 2025-2026 GITC — Global Innovation Technology Company (GITC)
# Builds signed Urbrain desktop installers (macOS / Windows / Linux) with Tauri
# and publishes them to this repo's Releases. The website's Download page reads
# the latest release from here.
#
# Layout note: the Tauri config (src-tauri/tauri.conf.json) references the web
# frontend as a SIBLING folder ("../urbrain-client"), via:
#   beforeBuildCommand: "cd ../urbrain-client && npm run build"
#   frontendDist:       "../urbrain-client/dist"
# So CI checks out BOTH repos side-by-side under the workspace root:
#   $GITHUB_WORKSPACE/urbrain-desktop   (this repo)
#   $GITHUB_WORKSPACE/urbrain-client    (private frontend, needs a PAT)
#
# Required secret:
#   CLIENT_CHECKOUT_TOKEN — a fine-grained PAT with read access to
#   projectminovative/urbrain-client (Contents: Read). Used only to check that
#   private repo out; the release upload itself uses the built-in GITHUB_TOKEN.
#
# Optional secrets (code signing / auto-update — safe to leave unset for now):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   (macOS notarization)
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater)

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            rust-targets: ""
            tauri-args: ""
          - platform: windows-latest
            rust-targets: ""
            tauri-args: "--config sign-config.json"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out desktop app (this repo)
        uses: actions/checkout@v4
        with:
          path: urbrain-desktop

      - name: Check out web frontend (private, sibling)
        uses: actions/checkout@v4
        with:
          repository: projectminovative/urbrain-client
          token: ${{ secrets.CLIENT_CHECKOUT_TOKEN }}
          path: urbrain-client

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: urbrain-desktop/src-tauri -> target

      - name: Install web frontend dependencies
        working-directory: urbrain-client
        run: npm ci || npm install

      - name: Install desktop app dependencies
        working-directory: urbrain-desktop
        run: npm ci || npm install

      # Writes urbrain-desktop/sign-config.json, merged by the Windows build via
      # `--config sign-config.json`. Picks the signing method from whichever secrets
      # are set — Azure Trusted Signing (preferred: instant SmartScreen trust) or a
      # .pfx certificate. With neither, it writes {} so unsigned builds still succeed.
      - name: Prepare Windows code signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: urbrain-desktop
        env:
          # Option A — SSL.com eSigner (cloud EV; instant SmartScreen trust)
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_CODESIGNTOOL_URL: ${{ secrets.ESIGNER_CODESIGNTOOL_URL }}
          # Option B — Azure Trusted Signing
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          # Option C — standard .pfx code signing certificate
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          # Default: no-op config so an unsigned build still works.
          Set-Content -Path sign-config.json -Value '{}' -Encoding ascii
          if (-not [string]::IsNullOrWhiteSpace($env:ESIGNER_USERNAME)) {
            Write-Host "Configuring SSL.com eSigner (CodeSignTool)..."
            $url = if ([string]::IsNullOrWhiteSpace($env:ESIGNER_CODESIGNTOOL_URL)) { "https://www.ssl.com/download/codesigntool-for-windows/" } else { $env:ESIGNER_CODESIGNTOOL_URL }
            $zip = Join-Path $env:RUNNER_TEMP "codesigntool.zip"
            $dst = Join-Path $env:RUNNER_TEMP "codesigntool"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath $dst -Force
            $bat = (Get-ChildItem -Path $dst -Recurse -Filter "CodeSignTool.bat" | Select-Object -First 1).FullName
            if ([string]::IsNullOrWhiteSpace($bat)) { throw "CodeSignTool.bat not found after extracting $url - set ESIGNER_CODESIGNTOOL_URL to the current Windows zip." }
            "CODESIGNTOOL_BAT=$bat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
            $wrapper = Join-Path $PWD "scripts\esigner-sign.ps1"
            $config = @{ bundle = @{ windows = @{ signCommand = @{ cmd = "powershell"; args = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $wrapper, "%1") } } } }
            $config | ConvertTo-Json -Depth 8 | Set-Content -Path sign-config.json -Encoding ascii
            Write-Host "SSL.com eSigner configured (CodeSignTool at $bat)."
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_ENDPOINT)) {
            Write-Host "Configuring Azure Trusted Signing..."
            cargo install trusted-signing-cli --locked
            $cmd = "trusted-signing-cli -e $($env:AZURE_SIGNING_ENDPOINT) -a $($env:AZURE_SIGNING_ACCOUNT) -c $($env:AZURE_SIGNING_PROFILE) %1"
            $config = @{ bundle = @{ windows = @{ signCommand = $cmd } } }
            $config | ConvertTo-Json -Depth 6 | Set-Content -Path sign-config.json -Encoding ascii
            Write-Host "Azure Trusted Signing configured."
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "Configuring .pfx certificate signing..."
            $pfxPath = Join-Path $env:RUNNER_TEMP "urbrain-code-sign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $securePwd = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePwd
            Remove-Item $pfxPath -Force
            $ts = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:WINDOWS_TIMESTAMP_URL }
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = $ts } } }
            $config | ConvertTo-Json -Depth 6 | Set-Content -Path sign-config.json -Encoding ascii
            Write-Host "Certificate signing configured (thumbprint $($cert.Thumbprint))."
          }
          else {
            Write-Host "No Windows signing secrets set - Windows build will be UNSIGNED."
          }

      - name: Build and publish with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Azure Trusted Signing auth — used by the Windows signCommand during the build
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # SSL.com eSigner auth — used by the Windows signCommand during the build
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
        with:
          projectPath: urbrain-desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Urbrain __VERSION__"
          releaseBody: "See the assets below to download and install Urbrain for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri-args }}

  # ── Windows signing via SignPath Foundation (free OSS signing) ────────────────
  # Signs the Windows installers as a post-build cloud step and replaces the
  # unsigned assets on the (draft) release in place. Runs ONLY when SignPath is
  # configured — i.e. the SIGNPATH_ORGANIZATION_ID repository *variable* is set —
  # so it stays dormant until you finish SignPath setup. macOS/Linux are unaffected.
  #
  # Required repo *variables* (Settings → Secrets and variables → Actions → Variables):
  #   SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
  #   SIGNPATH_SIGNING_POLICY_SLUG, SIGNPATH_ARTIFACT_CONFIG_SLUG
  # Required repo *secret*:
  #   SIGNPATH_API_TOKEN
  sign-windows:
    name: Sign Windows installers (SignPath)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download unsigned Windows installers from the draft release
        run: |
          mkdir -p unsigned
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "*.msi" --pattern "*.exe" --dir unsigned
          echo "Downloaded:"; ls -la unsigned

      - name: Package installers for SignPath
        run: (cd unsigned && zip -r ../windows-installers.zip .)

      - name: Upload artifact for SignPath
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-unsigned
          path: windows-installers.zip
          if-no-files-found: error

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace release assets with signed installers
        run: |
          # SignPath returns the signed artifact mirroring what we submitted.
          for z in signed/*.zip; do [ -f "$z" ] && unzip -o "$z" -d signed/extracted; done
          find signed -type f \( -iname "*.msi" -o -iname "*.exe" \) -print0 |
            while IFS= read -r -d '' f; do
              echo "Uploading signed $(basename "$f")"
              gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
            done
