<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Urbrain</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #faf7f2; }
    .frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .frame.hidden { visibility: hidden; pointer-events: none; }
    #urbrain-switch {
      position: fixed; bottom: 16px; right: 16px; z-index: 2147483647;
      display: flex; gap: 2px; background: rgba(17,17,24,.92);
      border: 1px solid rgba(255,255,255,.14); border-radius: 9999px; padding: 3px;
      box-shadow: 0 6px 24px rgba(0,0,0,.35);
      font-family: system-ui, -apple-system, sans-serif;
    }
    #urbrain-switch button {
      appearance: none; border: 0; outline: 0; border-radius: 9999px;
      padding: 6px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
      color: #9aa1ad; background: transparent; transition: color .15s, background .15s;
    }
    #urbrain-switch button.active { color: #fff; background: linear-gradient(135deg,#f97316,#a855f7); }
  </style>
</head>
<body>
  <!-- Both front-ends stay loaded; switching just shows/hides (instant, no reload). -->
  <iframe id="urbrain-consumer" class="frame" src="/"></iframe>
  <iframe id="urbrain-business" class="frame hidden" src="/dashboard/index.html"></iframe>

  <div id="urbrain-switch">
    <button id="urbrain-btn-c" class="active">Consumer</button>
    <button id="urbrain-btn-b">Business</button>
  </div>

  <script>
    (function () {
      var C = document.getElementById('urbrain-consumer');
      var B = document.getElementById('urbrain-business');
      var btnC = document.getElementById('urbrain-btn-c');
      var btnB = document.getElementById('urbrain-btn-b');

      function show(which) {
        var biz = which === 'business';
        B.classList.toggle('hidden', !biz);
        C.classList.toggle('hidden', biz);
        btnB.classList.toggle('active', biz);
        btnC.classList.toggle('active', !biz);
      }
      btnC.addEventListener('click', function () { show('consumer'); });
      btnB.addEventListener('click', function () { show('business'); });

      // Called from the tray (Rust eval). Business paths reveal the business iframe;
      // consumer paths reveal consumer and (for deep links) route it there.
      window.__urbrainNavigate = function (path) {
        if (path && path.indexOf('/dashboard') === 0) { show('business'); return; }
        show('consumer');
        if (path && path !== '/') { try { C.contentWindow.location.href = path; } catch (e) {} }
      };
    })();
  </script>
</body>
</html>
